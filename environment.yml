name: trainreq
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - numpy=1.24.3
  - scipy=1.11.1
  - pandas=2.0.3
  
  # PyTorch ecosystem with CUDA 11.8
  - pytorch::pytorch
  - pytorch::torchvision
  - pytorch::torchaudio
  - pytorch::pytorch-cuda
  - nvidia::cuda-toolkit=11.8
  
  # Computer Vision
  - conda-forge::opencv=4.8.0
  - pillow=10.0.0
  
  # Machine Learning & Optimization
  - scikit-learn=1.3.0
  - optuna=3.3.0
  
  # Visualization
  - matplotlib=3.7.2
  - seaborn=0.12.2
  
  # Jupyter
  - jupyter=1.0.0
  - notebook=7.0.2
  - ipykernel=6.25.1
  - ipywidgets=8.1.0
  
  # Testing
  - pytest=7.4.0
  - pytest-cov=4.1.0
  
  # Utilities
  - tqdm=4.66.1
  - pyyaml=6.0.1
  - requests=2.31.0
  
  # Logging
  - tensorboard=2.14.0
  
  - pip=23.2.1
